# Server Config
server.port: 8088
solon.app.name: fliad-tts

#########################################
# logging configuration
#########################################
# # 以下为默认值，可以都不加，或者想改哪行加哪行(支持"云端配置服务"进行配置，支持写到"云端日志服务")
solon.logging.appender:
  console:
    level: TRACE
    enable: true #是否启用
  file:
    name: "logs/${solon.app.name}"
    level: INFO
    enable: true #是否启用
    extension: ".log"   #v2.2.18 后支持（例：.log, .log.gz, .log.zip）
    maxFileSize: "10 MB"
    maxHistory: "7"
  cloud:
    level: INFO
    enable: false #是否启用

# TTS 配置
tts:
  # 默认音量 (0-100)
  default-volume: 5
  # 默认语速 (-10 - +10)
  default-rate: 1